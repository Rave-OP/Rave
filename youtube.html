<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RaveOP8 — YouTube</title>

    <style>
        @font-face {
            font-family: "ObelixPro";
            src: url("./fonts/ObelixPro.ttf") format("truetype");
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(255,0,40,.12),
                    transparent 35%
                ),
                #050505;

            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: min(90%, 420px);
            padding: 35px 25px;

            text-align: center;

            border: 1px solid rgba(255,255,255,.12);
            border-radius: 24px;

            background: rgba(255,255,255,.04);

            backdrop-filter: blur(20px);
        }

        h1 {
            margin: 0;

            font-family: "ObelixPro";
            font-size: 35px;
        }

        h1 span {
            color: #ff3045;
        }

        p {
            margin: 12px 0 25px;
            color: rgba(255,255,255,.5);
        }

        a {
            display: inline-block;

            padding: 13px 22px;

            border-radius: 12px;

            color: white;
            text-decoration: none;

            background: #ff3045;

            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>
        OPENING <span>RAVE</span>
    </h1>

    <p>
        Taking you to RaveOP8...
    </p>

    <a href="https://www.youtube.com/@RaveOP8">
        Open YouTube
    </a>

</div>

<script>

const youtubeURL =
    "https://www.youtube.com/@RaveOP8";

const userAgent =
    navigator.userAgent;

if (/Android/i.test(userAgent)) {

    window.location.href =
        "intent://www.youtube.com/@RaveOP8" +
        "#Intent;" +
        "package=com.google.android.youtube;" +
        "scheme=https;" +
        "S.browser_fallback_url=" +
        encodeURIComponent(youtubeURL) +
        ";end";

}
else if (/iPhone|iPad|iPod/i.test(userAgent)) {

    window.location.href =
        "youtube://www.youtube.com/@RaveOP8";

    setTimeout(() => {
        window.location.href = youtubeURL;
    }, 1500);

}
else {

    window.location.href = youtubeURL;

}

</script>

</body>
</html>
