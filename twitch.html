<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAVE — Twitch</title>

<link rel="icon" href="./img/banner.jpg">

<style>

@font-face {
    font-family: "ObelixPro";
    src: url("./fonts/ObelixPro.ttf") format("truetype");
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #050505;

    color: white;

    font-family: Arial, sans-serif;

    overflow: hidden;
}


/* =========================
   BACKGROUND
========================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    z-index: -2;

    background:
        linear-gradient(
            rgba(0,0,0,.62),
            rgba(0,0,0,.86)
        ),
        url("./img/banner.jpg")
        center / cover no-repeat;

    filter: blur(4px);

    transform: scale(1.05);
}


body::after {

    content: "";

    position: fixed;

    inset: 0;

    z-index: -1;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(180,0,255,.18),
            transparent 35%
        );

    pointer-events: none;
}


/* =========================
   CONTAINER
========================= */

.loader {

    width: min(90%, 430px);

    text-align: center;

    padding: 42px 30px;

    border-radius: 24px;

    border: 1px solid rgba(255,255,255,.12);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.08);

}


/* =========================
   LOGO
========================= */

.logo {

    font-family: "ObelixPro", sans-serif;

    font-size: 42px;

    letter-spacing: 2px;

    margin-bottom: 28px;
}

.logo span {
    color: #39ff14;
}


/* =========================
   TWITCH ICON
========================= */

.twitch-icon {

    width: 72px;
    height: 72px;

    margin: 0 auto 22px;

    display: grid;
    place-items: center;

    border-radius: 20px;

    color: #b85cff;

    background: rgba(170,70,255,.11);

    border: 1px solid rgba(190,90,255,.25);

    box-shadow:
        0 0 30px rgba(180,70,255,.20),
        inset 0 1px 0 rgba(255,255,255,.08);

    animation: pulse 1.8s ease-in-out infinite;
}

.twitch-icon svg {

    width: 34px;
    height: 34px;
}


/* =========================
   TEXT
========================= */

.title {

    font-family: "ObelixPro", sans-serif;

    font-size: 20px;

    letter-spacing: 1px;

    margin-bottom: 8px;
}

.subtitle {

    color: rgba(255,255,255,.48);

    font-size: 12px;

    letter-spacing: 1px;

    margin-bottom: 28px;
}


/* =========================
   LOADING
========================= */

.loading {

    width: 100%;

    height: 4px;

    border-radius: 999px;

    overflow: hidden;

    background: rgba(255,255,255,.08);
}

.loading-bar {

    width: 35%;

    height: 100%;

    border-radius: inherit;

    background: #b85cff;

    box-shadow:
        0 0 12px rgba(180,70,255,.7);

    animation:
        loading 1.4s ease-in-out infinite;
}


/* =========================
   FOOTER
========================= */

.footer {

    margin-top: 18px;

    color: rgba(255,255,255,.28);

    font-size: 9px;

    letter-spacing: 2px;

    text-transform: uppercase;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes loading {

    0% {
        transform: translateX(-120%);
    }

    50% {
        transform: translateX(130%);
    }

    100% {
        transform: translateX(300%);
    }

}

@keyframes pulse {

    0%,100% {
        transform: scale(1);

        box-shadow:
            0 0 25px rgba(180,70,255,.15);
    }

    50% {
        transform: scale(1.06);

        box-shadow:
            0 0 38px rgba(180,70,255,.3);
    }

}

</style>

</head>

<body>


<div class="loader">

    <div class="logo">
        <span>RAVE</span>
    </div>


    <div class="twitch-icon">

        <svg
            viewBox="0 0 24 24"
            fill="currentColor"
        >

            <path d="
                M4 2h18v13l-5 5h-4l-3 3H7v-3H2V6l2-4Zm1 3-1 3v8h4v3l3-3h5l4-4V5H5Zm9 7h-2V7h2v5Zm5 0h-2V7h2v5Z
            "/>

        </svg>

    </div>


    <div class="title">
        OPENING RAVE
    </div>

    <div class="subtitle">
        Launching Twitch...
    </div>


    <div class="loading">

        <div class="loading-bar"></div>

    </div>


    <div class="footer">
        GAMER • STREAMER • CREATOR
    </div>

</div>


<script>

const twitchUrl = "https://www.twitch.tv/ravexd_";

const ua = navigator.userAgent;


/* ANDROID */

if (/Android/i.test(ua)) {

    window.location.href =
        "intent://www.twitch.tv/ravexd_" +
        "#Intent;" +
        "package=tv.twitch.android.app;" +
        "scheme=https;" +
        "S.browser_fallback_url=" +
        encodeURIComponent(twitchUrl) +
        ";end";

}


/* iPHONE / iPAD */

else if (/iPhone|iPad|iPod/i.test(ua)) {

    window.location.href =
        "twitch://stream/ravexd_";

    setTimeout(() => {

        window.location.href = twitchUrl;

    }, 2000);

}


/* DESKTOP */

else {

    window.location.href = twitchUrl;

}

</script>

</body>

</html>
